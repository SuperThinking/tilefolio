[project]
name = "tilefolio"
version = "0.1.0"
description = "Minimal portfolio treemap — backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "casparser>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
